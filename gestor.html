<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYX MotorGest - Panel de Gestión</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .header { margin-bottom: 24px; border-bottom: 1px solid #27272a; padding-bottom: 16px; }
    h1 { color: #3b82f6; font-size: 24px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    p { color: #a1a1aa; font-size: 14px; }
    .table-card { background: #121215; border: 1px solid #27272a; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 18px; font-size: 14px; border-bottom: 1px solid #27272a; }
    th { background: #18181b; color: #a1a1aa; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    tr:last-child td { border-bottom: none; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
    .status-activo { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .status-pendiente { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
    .btn-action { background: #2563eb; color: #ffffff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
    .btn-action:hover { background: #1d4ed8; }
    .btn-block { background: #dc2626; }
    .btn-block:hover { background: #b91c1c; }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ Control de Licencias CYX</h1>
    <p>Verifica y aprueba los pagos de Zinli para activar a los talleres clientes.</p>
  </div>

  <div class="table-card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Usuario / ID</th>
            <th>Estado de Pago</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="users-table-body">
          <tr><td colspan="3" style="color: #a1a1aa; text-align: center;">Cargando lista de talleres...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jtywxpliivmlyicxibvwy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__4xJBaQpP30A_wt6qtvQjg_t1na3cqt';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function cargarUsuarios() {
      const tbody = document.getElementById('users-table-body');
      
      const { data: usuarios, error } = await supabaseClient
        .from('perfiles')
        .select('*');

      if (error) {
        tbody.innerHTML = `<tr><td colspan="3" style="color: #ef4444; text-align: center;">Error al cargar: ${error.message}</td></tr>`;
        return;
      }

      if (!usuarios || usuarios.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="color: #a1a1aa; text-align: center;">No hay talleres registrados aún.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      usuarios.forEach(user => {
        const esActivo = user.estado_pago === 'activo';
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td><strong>${user.email || user.id}</strong></td>
          <td>
            <span class="status-badge ${esActivo ? 'status-activo' : 'status-pendiente'}">
              ${user.estado_pago || 'pendiente'}
            </span>
          </td>
          <td>
            <button class="btn-action ${esActivo ? 'btn-block' : ''}" onclick="cambiarEstado('${user.id}', '${esActivo ? 'pendiente' : 'activo'}')">
              ${esActivo ? '🔒 Suspender Acceso' : '✅ Aprobar Pago Zinli'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function cambiarEstado(userId, nuevoEstado) {
      const { error } = await supabaseClient
        .from('perfiles')
        .update({ estado_pago: nuevoEstado })
        .eq('id', userId);

      if (error) {
        alert('Error al actualizar el estado: ' + error.message);
      } else {
        cargarUsuarios();
      }
    }

    window.addEventListener('load', cargarUsuarios);
  </script>
</body>
</html>
