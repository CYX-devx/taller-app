<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYX MotorGest - Taller Pro</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
    button { background: #007acc; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
    .hidden { display: none; }
    .plan-box { border: 2px solid #007acc; padding: 15px; border-radius: 8px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: REGISTRO / LOGIN -->
  <div id="auth-screen" class="card">
    <h2>CYX MotorGest - Acceso Mecánico</h2>
    <input type="text" id="username" placeholder="Nombre del Taller / Mecánico">
    <input type="password" id="password" placeholder="Contraseña">
    <button onclick="login()">Iniciar Sesión / Registrarse</button>
  </div>

  <!-- PANTALLA 2: SELECCIÓN DE PLAN -->
  <div id="plan-screen" class="card hidden">
    <h2>Selecciona tu Membresía</h2>
    <div class="plan-box">
      <h3>Plan Mensual PRO</h3>
      <p>$30 / Mes</p>
      <button onclick="setPlan('Mensual')">Activar Plan Mensual</button>
    </div>
    <div class="plan-box" style="border-color: #00ff88;">
      <h3>Plan Anual ELITE</h3>
      <p>$300 / Año (Ahorras 2 meses)</p>
      <button onclick="setPlan('Anual')" style="background: #00ff88; color: #000;">Activar Plan Anual</button>
    </div>
  </div>

  <!-- PANTALLA 3: PANEL PRINCIPAL (OFFLINE) -->
  <div id="app-screen" class="card hidden">
    <h2 id="taller-title">Panel de Control</h2>
    <p>Estado del Plan: <b id="user-plan" style="color:#00ff88;">-</b></p>
    <hr>
    <h3>Agregar Cliente / Vehículo</h3>
    <input type="text" id="cli-name" placeholder="Nombre del Cliente">
    <input type="text" id="cli-car" placeholder="Modelo de Vehículo (ej. Moto / Carro)">
    <button onclick="addClient()">Guardar en Base Local (Offline)</button>

    <h3>Clientes Registrados</h3>
    <ul id="client-list"></ul>

    <button onclick="exportData()" style="background: #28a745;">Exportar Datos (CSV / Excel)</button>
    <button onclick="logout()" style="background: #dc3545;">Cerrar Sesión</button>
  </div>

  <script>
    // Configuración PWA / Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }

    let currentUser = localStorage.getItem('cyx_user');
    let currentPlan = localStorage.getItem('cyx_plan');

    function init() {
      if (!currentUser) {
        show('auth-screen');
      } else if (!currentPlan) {
        show('plan-screen');
      } else {
        document.getElementById('taller-title').innerText = "Taller: " + currentUser;
        document.getElementById('user-plan').innerText = currentPlan;
        renderClients();
        show('app-screen');
      }
    }

    function show(id) {
      ['auth-screen', 'plan-screen', 'app-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function login() {
      const u = document.getElementById('username').value;
      if (u) {
        localStorage.setItem('cyx_user', u);
        currentUser = u;
        init();
      }
    }

    function setPlan(plan) {
      localStorage.setItem('cyx_plan', plan);
      currentPlan = plan;
      init();
    }

    function addClient() {
      const name = document.getElementById('cli-name').value;
      const car = document.getElementById('cli-car').value;
      if (!name || !car) return;
      
      const clients = JSON.parse(localStorage.getItem('cyx_clients') || '[]');
      clients.push({ name, car, date: new Date().toLocaleDateString() });
      localStorage.setItem('cyx_clients', JSON.stringify(clients));
      
      document.getElementById('cli-name').value = '';
      document.getElementById('cli-car').value = '';
      renderClients();
    }

    function renderClients() {
      const clients = JSON.parse(localStorage.getItem('cyx_clients') || '[]');
      const list = document.getElementById('client-list');
      list.innerHTML = clients.map(c => `<li><b>${c.name}</b> - ${c.car} (${c.date})</li>`).join('');
    }

    function exportData() {
      const clients = JSON.parse(localStorage.getItem('cyx_clients') || '[]');
      let csv = "Cliente,Vehiculo,Fecha\n" + clients.map(c => `"${c.name}","${c.car}","${c.date}"`).join("\n");
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Clientes_CYX_MotorGest.csv`;
      a.click();
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    init();
  </script>
</body>
</html>
